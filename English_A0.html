<head>

<title>Inglés desde cero</title>

<style>
/* VOICE: warm, encouraging teacher; simple Spanish, big friendly targets.
   IDEA: a travel road map — each unit is a stop on the trip toward A1.
   PICTURE: a dashed road winding across a red band, numbered stops lit as you pass.
   COLOUR and TYPE: tomato red field, ink, sunflower accent; Fredoka titles, Nunito body.
   LAYOUT: hero map + stats on top, unit stops below; lesson view = explanation, cards, quiz. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#141219);--ink:light-dark(#1b1b24,#f3f0f4);--soft:light-dark(#5d5b66,#b7b2bd);
--card:light-dark(#f4f4f6,#1f1c26);--line:light-dark(#e3e2e7,#2f2b37);
--red:#d93a2b;--red2:light-dark(#b72c1f,#a8281c);--sun:#ffc83d;--ok:#1f8a4c;--bad:#c62828;
--okbg:light-dark(#e5f5ec,#16301f);--badbg:light-dark(#fde8e6,#3a1714)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;line-height:1.08;margin:0;text-wrap:balance;font-weight:600}
h1{font-size:clamp(34px,5vw,52px)}h2{font-size:clamp(26px,3.4vw,34px)}h3{font-size:21px}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:44px;padding:0 16px;font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{background:var(--red);color:#fff;position:relative;overflow:hidden}
.hero .sunball{position:absolute;right:-90px;top:-110px;width:300px;height:300px;border-radius:50%;background:var(--sun);opacity:.95}
.hero .top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;position:relative}
.hero p.lead{margin:10px 0 0;max-width:56ch;font-size:18px;color:#ffe9e5}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:rgba(0,0,0,.2);border-radius:16px;padding:10px 16px;min-width:96px}
.stat b{display:block;font:600 26px/1.1 Fredoka,sans-serif}.stat span{font-size:13px;color:#ffe1db}
.map{position:relative;margin-top:22px;height:clamp(220px,26vw,300px)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;padding:0;font:600 21px Fredoka,sans-serif;
 background:#fff;color:var(--red2);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.stop.done{background:var(--sun);color:#1b1b24}
.stop.lock{background:rgba(255,255,255,.28);color:#fff;cursor:not-allowed;box-shadow:none}
.stop.next{animation:pulse 1.6s ease-in-out infinite}
.stop small{position:absolute;top:58px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px Nunito,sans-serif;color:#fff;letter-spacing:.2px}
@keyframes pulse{50%{box-shadow:0 5px 0 rgba(0,0,0,.25),0 0 0 10px rgba(255,200,61,.45)}}
.sync{font-size:13px;color:#ffe1db;margin-top:6px;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.ucard{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
.ucard.cur{border-color:var(--sun)}
.ucard .n{font:600 14px Fredoka,sans-serif;color:var(--red)}
.ucard p{margin:0;color:var(--soft);font-size:15px}
.ucard .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.stars{color:var(--sun);font-size:20px;letter-spacing:2px;text-shadow:0 1px 0 rgba(0,0,0,.25)}.stars i{color:var(--line);font-style:normal}
.go{background:var(--red);color:#fff}.go:disabled{background:var(--line);color:var(--soft);cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.badge{border-radius:999px;padding:8px 14px;background:var(--card);font-size:14px;color:var(--soft);border:2px dashed var(--line)}
.badge.on{background:var(--sun);color:#1b1b24;border:2px solid var(--sun);font-weight:800}
.sec{margin-top:34px}.sec>h2{margin-bottom:12px}
.ubar{background:var(--red);color:#fff}
.ubar .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ubar button{background:rgba(0,0,0,.2);color:#fff}
.ubar .xp{margin-left:auto;font:600 18px Fredoka,sans-serif}
.intro{max-width:70ch;font-size:18px}.intro p{margin:0 0 10px}
.tip{background:light-dark(#fff6d9,#2c2614);border-radius:16px;padding:14px 18px;margin:14px 0;max-width:70ch}
.tip b{font-family:Fredoka,sans-serif}
table.gr{border-collapse:collapse;margin:14px 0;min-width:min(100%,420px)}
table.gr td{padding:8px 14px;border-bottom:1px solid var(--line)}table.gr td:first-child{font-weight:800}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.wc{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px}
.wc .en{font:600 26px/1.15 Fredoka,sans-serif;display:flex;align-items:center;gap:10px}
.wc.long .en{font-size:21px}
.sw{width:26px;height:26px;border-radius:8px;flex:none;border:2px solid var(--line)}
.wc .es{color:var(--soft)}.wc .hint{font-size:14px;color:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.play{background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:6px}
.slow{background:transparent;border:2px solid var(--line);color:var(--ink)}
.mic{background:var(--sun);color:#1b1b24;display:inline-flex;align-items:center;gap:6px}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
svg.i{width:18px;height:18px;flex:none}
.res{font-size:15px;border-radius:12px;padding:10px 12px;display:none}
.res.show{display:block}.res.good{background:var(--okbg)}.res.mid{background:light-dark(#fff6d9,#2c2614)}.res.low{background:var(--badbg)}
.res .w-ok{color:var(--ok);font-weight:800}.res .w-no{color:var(--bad);font-weight:800;text-decoration:underline wavy}
.quiz{background:var(--card);border-radius:24px;padding:clamp(18px,3vw,32px);max-width:760px}
.qprog{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}.qprog i{display:block;height:100%;background:var(--sun);transition:width .3s}
.qtext{font:600 24px/1.2 Fredoka,sans-serif;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.opt{background:var(--bg);color:var(--ink);border:2px solid var(--line);text-align:left;padding:12px 16px;font-size:18px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:14px;border-radius:14px;padding:12px 16px;display:none}.fb.show{display:block}
.fb.good{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.qnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.big{font:600 46px Fredoka,sans-serif}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.inrow input{flex:1 1 220px;font:inherit;font-size:18px;min-height:50px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.inrow input:focus{outline:3px solid var(--sun);outline-offset:1px}
.gapline{font:600 22px/1.3 Fredoka,sans-serif;margin:0 0 12px}.blank{color:var(--red)}
.ord{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:8px 0}.ord.out{border-bottom:2px dashed var(--line);margin-bottom:8px}
.tok{background:var(--bg);border:2px solid var(--line);color:var(--ink);font-size:18px}
.passage{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-size:19px;line-height:1.6;white-space:pre-line;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:800;transition:transform .3s;z-index:9}
.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:8;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}.modal>div{background:var(--bg);border-radius:20px;padding:24px;max-width:420px}
.foot{color:var(--soft);font-size:14px}
@media(max-width:1000px){.stop small{display:none}}
@media(max-width:600px){.stop{width:44px;height:44px;font-size:18px}.stop small{display:none}.hero .sunball{width:200px;height:200px;right:-80px;top:-90px}.ubar .xp{margin-left:0}}
@media(prefers-reduced-motion:reduce){.stop.next,.mic.rec{animation:none}.confetti{display:none}.qprog i,.toast{transition:none}}
</style>
</head>

/* ---------- Pronunciation scoring ---------- */
const NUMS=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function words(s){
 s=(s||'').toLowerCase().replace(/[’`]/g,"'").replace(/-/g,' ').replace(/\bi'm\b/g,'i am').replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/\bcan not\b/g,'cannot');
 return s.replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean).flatMap(w=>{const n=+w;if(/^\d+$/.test(w)){if(n<=20)return[NUMS[n]];if(n<100){const t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'][Math.floor(n/10)];return n%10?[t,NUMS[n%10]]:[t]}}return[w.replace(/'/g,'')]});
}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function score(target,heard){
 const t=words(target),h=words(heard),used=new Set();let p=0;
 const marks=t.map(w=>{let k=-1;for(let i=p;i<h.length;i++)if(!used.has(i)&&sim(w,h[i])>=.75){k=i;break}
  if(k<0)for(let i=0;i<h.length;i++)if(!used.has(i)&&sim(w,h[i])>=.75){k=i;break}
  if(k>=0){used.add(k);p=k+1;return true}return false});
 const ok=marks.filter(Boolean).length;let pct=t.length?Math.round(ok/t.length*100):0;
 const extra=Math.max(0,h.length-used.size-1);pct=Math.max(0,pct-extra*5);
 return{pct,marks,tw:target.split(/\s+/)};
}
function feedbackHTML(target,heard,hint,alt){
 if(heard===''||heard==null)return{cls:'low',pct:0,html:'No te escuché. Habla un poco más alto y cerca del micrófono.'};
 let r=score(target,heard);
 if(alt){const h=words(heard).join(' ');if(alt.some(a=>words(a).join(' ')===h||words(heard).includes(a)))r={pct:100,marks:r.marks.map(()=>true)};else for(const a of alt){const x=score(a,heard);if(x.pct>r.pct)r={pct:x.pct,marks:r.marks.map(()=>x.pct>=70)}}}
 const msg=r.pct>=90?'¡Perfecto! Te entendí muy bien.':r.pct>=70?'¡Muy bien! Casi perfecto.':r.pct>=40?'Vas bien. Repite las palabras subrayadas.':'No te entendí bien. Escucha otra vez (prueba «Lento») y repite despacio.';
 const ws=target.split(/\s+/).map((w,i)=>`<span class="${r.marks[i]?'w-ok':'w-no'}">${w}</span>`).join(' ');
 return{cls:r.pct>=70?'good':r.pct>=40?'mid':'low',pct:r.pct,html:`<b>${r.pct}% · ${msg}</b><br>Te escuché: «${esc(heard)}»<br>${ws}${r.pct<70&&hint?'<br>Consejo: '+hint:''}`};
}

  <div class="grid">${U.map((u,i)=>{const st=stars(u.id),open=unlocked(i);return`<article class="ucard ${i===nextI?'cur':''}"><span class="n">Unidad ${i+1} · ${u.s}</span><h3>${u.t}</h3><p>${u.d}</p><div class="row"><span class="stars" aria-label="${st} de 3 estrellas">${starStr(st)}</span><button class="go" data-u="${u.id}" ${open?'':'disabled'}>${!open?'Bloqueada':st?'Repasar':i===nextI?'Empezar':'Abrir'}</button></div></article>`}).join('')}</div></section>
  <section class="sec"><h2>Medallas</h2><div class="badges">${BADGES.map(b=>`<span class="badge ${S.badges.includes(b[0])?'on':''}" title="${b[2]}">${b[1]} · <small>${b[2]}</small></span>`).join('')}</div></section>
  <section class="sec foot"><p>El micrófono funciona en Chrome (Android) y Safari (iPhone). La primera vez, permite el acceso al micrófono. El programa comprueba si entiende tus palabras; no analiza cada sonido como un profesor.</p><button class="ghost" id="reset">Borrar progreso</button></section>
 </div></main>`;
 const road=document.getElementById('road'),map=document.getElementById('map'),L=road.getTotalLength();
 map.insertAdjacentHTML('beforeend',U.map((u,i)=>{const pt=road.getPointAtLength(L*(.03+.94*i/(U.length-1)));const st=stars(u.id),open=unlocked(i);
  return`<button class="stop ${st?'done':open?'':'lock'} ${i===nextI?'next':''}" style="left:${pt.x/10}%;top:${pt.y/2.6}%" data-u="${u.id}" ${open?'':'aria-disabled="true"'} aria-label="Unidad ${i+1}: ${u.t}">${i+1}<small>${u.t}</small></button>`}).join(''));
}

/* ---------- Unit ---------- */
let Q=null,curU=null;
function unit(u){
 curU=u;const isRead=!!u.read;
 app.innerHTML=`
 <div class="ubar band" style="padding-block:14px"><div class="wrap"><button id="back">← Mapa</button><span>Unidad ${num(u)} de ${U.length}</span><span class="xp" id="xpNow">${S.xp} XP</span></div></div>
 <header class="hero band" style="padding-top:18px"><div class="sunball"></div><div class="wrap" style="position:relative"><h1>${u.t}</h1><p class="lead">${u.s} · ${u.d}</p></div></header>
 <main class="band"><div class="wrap">
  <section><h2>Explicación</h2><div class="intro">${u.intro.map(p=>`<p>${p}</p>`).join('')}</div>
  ${u.table?`<table class="gr">${u.table.map(r=>`<tr><td><button class="play" data-say="${esc(r[2]||r[0].replace(/ \(.*\)/,''))}" aria-label="Escuchar">${ICON.play}</button> ${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`:''}
  <div class="tip"><b>Truco:</b> ${u.tip}</div></section>
  <section class="sec"><h2>${isRead?'Lee, escucha y repite':'Escucha y repite'}</h2>
  ${isRead?`<div class="btns" style="margin-bottom:14px"><button class="play" id="all">${ICON.play} Escuchar todo</button><button class="slow" id="allSlow">Todo lento</button></div>`:''}
  <div class="wcards">${u.items.map((it,i)=>`<div class="wc ${it.en.length>16?'long':''}"><div class="en">${it.sw?`<span class="sw" style="background:${it.sw}"></span>`:''}${esc(it.en)}${S.said[u.id+'-'+i]?' <span title="Pronunciada bien" style="color:var(--ok);font-size:18px">✓</span>':''}</div><div class="es">${esc(it.es)}</div>${it.hint?`<div class="hint">${it.hint}</div>`:''}
   <div class="btns"><button class="play" data-say="${esc(it.say||it.en)}">${ICON.play} Escuchar</button><button class="slow" data-slow="${esc(it.say||it.en)}">Lento</button><button class="mic" data-mic="${i}">${ICON.mic} Habla</button></div><div class="res" id="r${i}" aria-live="polite"></div></div>`).join('')}</div></section>
  <section class="sec"><h2>Mini quiz</h2><div class="quiz" id="quiz"></div></section>
 </div></main>`;
 quizStart(true);window.scrollTo(0,0);
}
function micClick(btn,it,resEl,onScore){const target=it.en,hint=it.hint;
 if(btn.classList.contains('rec')){stopListen();return}
 btn.classList.add('rec');btn.lastChild.textContent=' Parar';resEl.className='res show mid';resEl.textContent='Te escucho… di: «'+target+'»';
 listen(t=>{resEl.textContent='Te escucho: «'+t+'»'},(text,why)=>{
  btn.classList.remove('rec');btn.lastChild.textContent=btn.dataset.label||' Habla';
  if(text==null){resEl.className='res show low';resEl.textContent=micMsg(why);return}
  const f=feedbackHTML(target,text,hint,it.alt);resEl.className='res show '+f.cls;resEl.innerHTML=f.html;onScore(f.pct);
 });
}

/* ---------- Quiz ---------- */
function makeQuiz(u){
 const items=u.items.map((it,i)=>Object.assign({i},it));const qs=[];
 const concept=shuffle(u.qs).slice(0,u.read?4:2).map(c=>({type:'concept',q:c[0],opts:c[1].map((o,k)=>({t:o,ok:k===c[2]})),ex:c[3]}));
 const pick=shuffle(u.qtypes?items.filter(x=>x.letter):items),types=u.qtypes||shuffle(['listen','es2en','en2es','listen','es2en']);
 const nGen=u.read?1:u.qtypes?3:2;
 for(let k=0;k<nGen;k++){const it=pick[k%pick.length],ty=u.read?'listen':types[k];const dis=shuffle(items.filter(x=>x.en!==it.en&&!!x.letter===!!it.letter)).slice(0,3);
  const field=ty==='en2es'?'es':'en';
  qs.push({type:ty,it,q:ty==='listen'?'Escucha y elige lo que oyes':ty==='es2en'?`¿Cómo se dice «${it.es}» en inglés?`:`¿Qué significa «${it.en}»?`,
   opts:shuffle([it,...dis]).map(x=>({t:x[field],ok:x.en===it.en})),ex:`${it.en} = ${it.es}`})}
 qs.push(...concept);
 const plain=items.filter(x=>!x.letter&&!x.nowrite),nw=x=>x.en.split(' ').length;
 const short=shuffle(plain.filter(x=>nw(x)<=4)),base=x=>x.es.replace(/\s*\(.*\)/,'').trim().toLowerCase();
 if(u.spells)shuffle(u.spells).slice(0,2).forEach(sp=>qs.push({type:'spell',q:'Escucha las letras y escribe la palabra',say:sp[1],ans:[sp[0]],ex:`${sp[1].toUpperCase()} → ${sp[0]}`}));
 else if(short[0])qs.push({type:'type',q:'Escucha y escribe lo que oyes',say:short[0].say||short[0].en,ans:[short[0].en],ex:`${short[0].en} = ${short[0].es}`});
 if(!u.read&&!u.qtypes&&short[1]){const it=short[1];qs.push({type:'translate',q:`Escribe en inglés: «${it.es}»`,ans:plain.filter(x=>base(x)===base(it)).map(x=>x.en),ex:`${it.es} = ${it.en}`})}
 if(u.gaps){const g=shuffle(u.gaps)[0],a=[].concat(g[1]);qs.push({type:'gap',q:'Completa la frase',gap:g[0],ans:a,ex:`${g[0].replace('___',a[0])} = ${g[2]}`})}
 const op=shuffle(plain.filter(x=>nw(x)>=3&&nw(x)<=8));
 if(op[0]){const it=op[0],tok=it.en.split(' ');let sh=tok.map((t,k)=>k);for(let n=0;n<20&&sh.map(k=>tok[k]).join(' ')===it.en;n++)sh=shuffle(sh);qs.push({type:'order',q:`Ordena las palabras: «${it.es}»`,tok,sh,ans:[it.en],ex:`${it.en} = ${it.es}`})}
 if(u.reads){const r=shuffle(u.reads)[0];qs.push({type:'read',q:r[1],text:r[0],opts:r[2].map((o,k)=>({t:o,ok:k===r[3]})),ex:r[4]})}
 const sayIt=shuffle(items.filter(x=>!x.letter&&x.en.split(' ').length<=6))[0]||items[0];
 qs.push({type:'say',it:sayIt,q:`Di en voz alta: «${sayIt.en}»`,ex:`${sayIt.en} = ${sayIt.es}`});
 return shuffle(qs.slice(0,-1)).concat(qs.slice(-1));
}
function quizStart(intro){
 const el=document.getElementById('quiz');const u=curU;
 if(intro){const st=stars(u.id);el.innerHTML=`<p class="qtext">${st?'Ya tienes '+st+' de 3 estrellas. ¿Quieres mejorar?':'¿Listo? Responde unas preguntas sobre esta unidad.'}</p><p class="foot">Escuchar, leer, escribir y hablar. Gana 10 XP por cada respuesta correcta. Con 60% apruebas y abres la siguiente unidad.</p><button class="go" id="qgo">Empezar el quiz</button>`;return}
 Q={u,qs:makeQuiz(u),i:0,right:0,total:0};quizShow();
}
function quizShow(){
 const el=document.getElementById('quiz'),q=Q.qs[Q.i],n=Q.qs.length;
 let body='';
 if(q.type==='say')body=`<div class="btns"><button class="play" data-say="${esc(q.it.say||q.it.en)}">${ICON.play} Escuchar</button><button class="mic" id="qmic">${ICON.mic} Hablar</button><button class="ghost" id="qskip">No puedo hablar ahora</button></div><div class="res" id="qres" aria-live="polite"></div>`;
 else if(['type','spell','translate','gap'].includes(q.type))body=`${q.say?`<div class="btns" style="margin-bottom:12px"><button class="play" data-say="${esc(q.say)}">${ICON.play} Escuchar</button><button class="slow" data-slow="${esc(q.say)}">Lento</button></div>`:''}${q.gap?`<p class="gapline">${esc(q.gap).replace('___','<span class="blank">_____</span>')}</p>`:''}<div class="inrow"><input id="qin" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Tu respuesta" placeholder="Escribe aquí…"><button class="go" id="qcheck">Comprobar</button></div>`;
 else if(q.type==='order')body=`<div class="ord out" id="ordOut" aria-label="Tu frase"></div><div class="ord" id="ordBank">${q.sh.map(k=>`<button class="tok" data-tok="${k}">${esc(q.tok[k])}</button>`).join('')}</div><div class="btns"><button class="go" id="qcheck">Comprobar</button></div>`;
 else body=`${q.type==='read'?`<div class="passage">${esc(q.text)}</div>`:''}${q.type==='listen'||q.type==='en2es'?`<div class="btns" style="margin-bottom:12px"><button class="play" data-say="${esc(q.it.say||q.it.en)}">${ICON.play} Escuchar</button><button class="slow" data-slow="${esc(q.it.say||q.it.en)}">Lento</button></div>`:''}<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-o="${k}">${esc(o.t)}</button>`).join('')}</div>`;
 el.innerHTML=`<div class="qprog" aria-hidden="true"><i style="width:${Q.i/n*100}%"></i></div><span class="foot">Pregunta ${Q.i+1} de ${n}</span><p class="qtext">${esc(q.q)}</p>${body}<div class="fb" id="fb" aria-live="polite"></div><div class="qnav" id="qnav"></div>`;
 if(q.type==='listen')speak(q.it.say||q.it.en);
 if(q.say)speak(q.say);
}
function quizAnswer(ok,skipped,note){
 const q=Q.qs[Q.i];if(!skipped){Q.total++;if(ok){Q.right++;addXP(10)}beep(ok)}
 const fb=document.getElementById('fb');fb.className='fb show '+(skipped?'':ok?'good':'bad');
 fb.innerHTML=(skipped?'Sin problema, la saltamos.':ok?'<b>¡Correcto!</b> ':'<b>No es correcto.</b> ')+(note||'')+' '+esc(q.ex);
 document.getElementById('qnav').innerHTML=`<button class="go" id="qnext">${Q.i+1<Q.qs.length?'Siguiente':'Ver resultado'}</button>`;
 document.getElementById('qnext').focus();
}
function checkText(val,ans,exact){
 const v=words(val).join(' ');let best=1e9,bt=ans[0];
 for(const a of ans){const t=words(a).join(' ');if(t===v)return{ok:true,note:''};const d=lev(v,t);if(d<best){best=d;bt=a}}
 const tol=exact?0:Math.floor(words(bt).join(' ').length/8);
 if(best<=tol)return{ok:true,note:'Casi perfecto. Revisa la ortografía: «'+esc(bt)+'».<br>'};
 return{ok:false,note:'Escribiste: «'+esc(val)+'». Lo correcto: «'+esc(bt)+'».<br>'};
}
function quizEnd(){
 const u=Q.u,pct=Q.total?Math.round(Q.right/Q.total*100):0,st=pct>=100?3:pct>=80?2:pct>=60?1:0,prev=stars(u.id);
 const rec=S.units[u.id]||{stars:0,best:0};
 if(st>prev)rec.stars=st;rec.best=Math.max(rec.best||0,pct);S.units[u.id]=rec;
 if(st&&!prev){award('quiz');addXP(30,'unidad completada')}
 if(st===3)award('perfect');if(doneCount()>=6)award('a1');if(doneCount()>=U.length)award('all');save();
 const idx=U.indexOf(u),next=U[idx+1];
 document.getElementById('quiz').innerHTML=`<div class="qprog"><i style="width:100%"></i></div><div class="big">${pct}%</div><div class="stars" style="font-size:38px">${starStr(st)}</div>
  <p class="qtext">${st===3?'¡Perfecto! Eres una estrella.':st?'¡Aprobado! Muy buen trabajo.':'Todavía no. Repasa las tarjetas y vuelve a intentarlo.'}</p>
  <p>${Q.right} de ${Q.total} respuestas correctas.${st&&next&&!prev?' Has abierto la unidad '+num(next)+': '+next.t+'.':''}</p>
  <div class="qnav">${st&&next?`<button class="go" data-u="${next.id}">Siguiente unidad →</button>`:''}<button class="ghost" id="qagain">Repetir quiz</button><button class="ghost" id="qhome">Volver al mapa</button></div>`;
 if(st)confetti();
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.u){const u=U.find(x=>x.id==b.dataset.u),i=U.indexOf(u);if(!unlocked(i)){toast('Aprueba la unidad anterior para abrir esta');return}location.hash='unidad-'+u.id;return}
 if(b.dataset.say!==undefined){speak(b.dataset.say,false);return}
 if(b.dataset.slow!==undefined){speak(b.dataset.slow,true);return}
 if(b.dataset.mic!==undefined){const i=+b.dataset.mic,it=curU.items[i],key=curU.id+'-'+i;
  micClick(b,it,document.getElementById('r'+i),pct=>{if(pct>=70){beep(true);if(!S.said[key]){S.said[key]=1;award('first');addXP(5,'buena pronunciación')}}});return}
 switch(b.id){
  case'back':case'qhome':location.hash='';return;
  case'reset':document.getElementById('modal').classList.add('show');document.getElementById('mNo').focus();return;
  case'mNo':document.getElementById('modal').classList.remove('show');return;
  case'mYes':S=blank();save();document.getElementById('modal').classList.remove('show');render();toast('Progreso borrado');return;
  case'all':case'allSlow':speak(curU.items.map(x=>x.en).join(' '),b.id==='allSlow');return;
  case'qgo':case'qagain':quizStart(false);return;
  case'qnext':Q.i++;if(Q.i<Q.qs.length)quizShow();else quizEnd();return;
  case'qcheck':{if(document.getElementById('qnext'))return;const q=Q.qs[Q.i];let val;
   if(q.type==='order'){val=[...document.querySelectorAll('#ordOut .tok')].map(x=>q.tok[+x.dataset.tok]).join(' ');if(!val){toast('Toca las palabras en orden');return}document.querySelectorAll('.tok').forEach(x=>x.disabled=true)}
   else{const inp=document.getElementById('qin');val=inp.value.trim();if(!val){inp.focus();return}inp.disabled=true}
   const r=checkText(val,q.ans,q.type==='order');quizAnswer(r.ok,false,r.note);return}
  case'qskip':if(!document.getElementById('qnext'))quizAnswer(false,true);return;
  case'qmic':{if(document.getElementById('qnext'))return;const q=Q.qs[Q.i];b.dataset.label=' Hablar';
   micClick(b,Object.assign({},q.it,{hint:''}),document.getElementById('qres'),pct=>{if(pct>=70)quizAnswer(true);else{document.getElementById('qres').innerHTML+='<br><b>Inténtalo otra vez</b> o pulsa «No puedo hablar ahora».'}});return}
 }
 if(b.dataset.tok!==undefined){const out=document.getElementById('ordOut'),bank=document.getElementById('ordBank');(b.parentNode===out?bank:out).appendChild(b);return}
 if(b.dataset.o!==undefined&&Q){const q=Q.qs[Q.i];if(document.getElementById('qnext'))return;const k=+b.dataset.o,ok=q.opts[k].ok;
  document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j].ok)x.classList.add('right');else if(j===k)x.classList.add('wrong')});quizAnswer(ok)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qin'){e.preventDefault();const c=document.getElementById('qcheck');if(c)c.click();return}if(e.key==='Escape')document.getElementById('modal').classList.remove('show')});
function render(){const m=/^#unidad-(\d+)$/.exec(location.hash);const u=m&&U.find(x=>x.id==m[1]);if(u&&unlocked(U.indexOf(u)))unit(u);else{curU=null;Q=null;home()}}
window.addEventListener('hashchange',()=>{stopListen();if(window.speechSynthesis)speechSynthesis.cancel();render();window.scrollTo(0,0)});
if(window.speechSynthesis)speechSynthesis.getVoices();
render();
}
</script>
